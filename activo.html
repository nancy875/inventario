<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Activo fijo — cosmos.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap">
<style>
:root{
  --navy:#0A2440; --blue:#0A5695; --blue-bg:#E7F0F8; --red:#C0392B; --red-bg:#FBEAEA;
  --green:#1A7A4A; --green-bg:#E6F4ED; --amber:#A05C00; --amber-bg:#FEF3E2;
  --text:#1E2430; --text2:#5A6170; --text3:#8B909B; --border:#E2E0D8; --bg:#F4F3EF; --card:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Century Gothic','Didact Gothic',CenturyGothic,AppleGothic,sans-serif;background:var(--bg);color:var(--text);font-size:15px;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header .marca{font-weight:700;letter-spacing:.3px;font-size:16px}
header .sub{font-size:11px;opacity:.75}
header button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:5px 10px;font-family:inherit;font-size:12px;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
.folio{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pill{font-weight:700;color:#fff;border-radius:6px;padding:3px 10px;font-size:13px}
.pill.EC{background:var(--blue)} .pill.ME{background:var(--red)}
.folio-num{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;letter-spacing:.5px}
h2{font-size:18px;margin:6px 0 2px} .muted{color:var(--text2);font-size:13px}
label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{width:100%;font-family:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text)}
input[readonly]{background:#F1F0EC;color:var(--text2)}
textarea{min-height:70px;resize:vertical}
.btn{display:block;width:100%;border:none;border-radius:10px;padding:14px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}
.btn.pri{background:var(--blue);color:#fff} .btn.sec{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.gray{background:#fff;color:var(--text2);border:1px solid var(--border)}
.btn:disabled{opacity:.6}
.err{background:var(--red-bg);color:var(--red);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px;display:none}
.ok{background:var(--green-bg);color:var(--green);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.aviso{background:var(--amber-bg);color:var(--amber);border-radius:8px;padding:10px 12px;font-size:13px}
.dato{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:14px}
.dato:last-child{border-bottom:none} .dato span:first-child{color:var(--text3)} .dato span:last-child{text-align:right;font-weight:600}
.foto{width:100%;border-radius:10px;border:1px solid var(--border);margin-top:8px;display:block}
.fotoprev{max-height:220px;object-fit:cover}
.lista-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer;background:#fff}
.lista-item:active{background:var(--blue-bg)}
.lista-item b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.centro{text-align:center} .oculto{display:none}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:g 1s linear infinite;margin:18px auto}
@keyframes g{to{transform:rotate(360deg)}}
.req{color:var(--red)}
</style>
</head>
<body>
<header>
  <div><div class="marca">cosmos.ai · Activo fijo</div><div class="sub">Consulta de bienes por etiqueta</div></div>
  <button id="btnSalir" class="oculto" onclick="salir()">Salir</button>
</header>
<main>
  <div id="vista"><div class="spin"></div></div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// Configuración (la misma del sistema de inventario)
// ─────────────────────────────────────────────────────────────────────────────
var FB_CFG = {
  apiKey:'AIzaSyDwRv1X3bST-TmGN8UPc8RuMXbgJEfgR40',
  authDomain:'proesa-inventario.firebaseapp.com',
  databaseURL:'https://proesa-inventario-default-rtdb.firebaseio.com',
  projectId:'proesa-inventario',
  storageBucket:'proesa-inventario.firebasestorage.app',
  messagingSenderId:'531584146155',
  appId:'1:531584146155:web:79dd08e29e0e5fcfc63cae'
};
var AUTH_DOMINIO = 'inventario.cxsmxs.tech';
// Personal autorizado: puede dar de alta y editar. Cualquier otra persona solo ve la ficha básica.
var USUARIOS_QR = {
  'nancy':    'Nancy Sierra Torres',
  'emilio':   'Emilio Guerra Estevez',
  'yuritzia': 'Yuritzia Cortes Mena',
  'admin':    'Administrador'
  // Ana Paula: solo consulta (ve la ficha como cualquier persona, sin editar)
};
var CLASIF = {
  EC: ['Equipo de Cómputo','Equipo de Cómputo y Periféricos'],
  ME: ['Mobiliario y equipo de oficina']
};
var ESTADOS = ['Nuevo','Bueno','De uso','Dañado'];
var UBICACIONES = ['Oficina Toluca','Oficina CDMX','Otro'];

firebase.initializeApp(FB_CFG);
var auth = firebase.auth(), db = firebase.database();
var refHW = db.ref('proesa/hw');

var params = new URLSearchParams(location.search);
var FOLIO = (params.get('inv')||'').trim().toUpperCase();
var PREFIJO = (FOLIO.match(/^(EC|ME)-/)||[])[1] || '';
var hwLista = [], hwCargado = false, bien = null, fotoNueva = null, usuarioNombre = '';

function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function vista(html){ $('vista').innerHTML = html; window.scrollTo(0,0); }
function hoy(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function aArreglo(v){ if(!v) return []; return Array.isArray(v) ? v.filter(Boolean) : Object.keys(v).map(function(k){return v[k];}).filter(Boolean); }
function encabezadoFolio(){
  return '<div class="folio"><span class="pill '+PREFIJO+'">'+PREFIJO+'</span><span class="folio-num">'+esc(FOLIO)+'</span></div>';
}

// ─────────────────────────────────────────────────────────────────────────────
// 1. Validar folio y sesión
// ─────────────────────────────────────────────────────────────────────────────
if(!/^(EC|ME)-\d{10}$/.test(FOLIO)){
  vista('<div class="card centro"><h2>Etiqueta no válida</h2><p class="muted">Escanea el código QR de una etiqueta de activo fijo de cosmos.ai.</p></div>');
} else {
  auth.onAuthStateChanged(function(u){
    var usr = u ? (u.email||'').split('@')[0] : '';
    if(!u || !USUARIOS_QR[usr] || (u.email||'').split('@')[1]!==AUTH_DOMINIO){
      $('btnSalir').classList.add('oculto');
      vistaPublica();
      return;
    }
    usuarioNombre = USUARIOS_QR[usr];
    $('btnSalir').classList.remove('oculto');
    cargar();
  });
}

// Vista para cualquier persona: solo lectura, sin iniciar sesión
function vistaPublica(){
  try{ refHW.off(); }catch(e){}
  hwCargado=false;
  vista('<div class="spin"></div>');
  db.ref('activosPublicos/'+FOLIO).once('value').then(function(s){
    var b=s.val();
    var boton='<button class="btn gray" onclick="pantallaLogin()">🔐 Personal autorizado: iniciar sesión</button>';
    if(!b){
      vista('<div class="card">'+encabezadoFolio()+'<div class="aviso">Esta etiqueta todavía no está registrada.</div>'+boton+'</div>');
      return;
    }
    function d(et,v){ return '<div class="dato"><span>'+et+'</span><span>'+esc(v||'—')+'</span></div>'; }
    vista('<div class="card">'+encabezadoFolio()+
      '<h2>'+esc(b.desc||'Sin descripción')+'</h2><div class="muted">'+esc(b.clasif||'')+'</div>'+
      '<div id="fotoBox"></div>'+
      '<div style="margin-top:10px">'+
        d('Marca / modelo',[b.marca,b.modelo].filter(function(x){return x&&x!=='N/A';}).join(' · '))+
        d('Estado',b.estado)+d('Ubicación',b.ubicacion)+d('Resguardatario',b.resguardatario)+
      '</div>'+
      '<p class="muted" style="margin-top:12px">Activo fijo propiedad de cosmos.ai. Si encuentras este bien fuera de su lugar, avisa al área de Administración.</p>'+
      boton+'</div>');
    if(b.tieneFoto) cargarFoto();
  }).catch(function(){
    vista('<div class="card">'+encabezadoFolio()+'<p class="muted">No se pudo consultar la etiqueta. Revisa tu conexión.</p></div>');
  });
}
function cargarFoto(){
  var box=$('fotoBox'); if(!box) return;
  box.innerHTML='<div class="spin"></div>';
  db.ref('hwfotos/'+FOLIO).once('value').then(function(s){
    var f=s.val(); var src=f&&(f.data||f);
    if($('fotoBox')) $('fotoBox').innerHTML = (typeof src==='string' && src.indexOf('data:image')===0) ? '<img class="foto" src="'+src+'" alt="Foto del bien">' : '';
  }).catch(function(){ if($('fotoBox')) $('fotoBox').innerHTML=''; });
}

function pantallaLogin(msg){
  vista('<div class="card">'+encabezadoFolio()+
    '<p class="muted">Inicia sesión para ver o registrar este bien.</p>'+
    '<label>Usuario</label><input id="lu" autocomplete="username" autocapitalize="none" placeholder="tu usuario">'+
    '<label>Contraseña</label><input id="lp" type="password" autocomplete="current-password">'+
    '<button class="btn pri" id="lb" onclick="entrar()">Entrar</button>'+
    '<button class="btn gray" onclick="vistaPublica()">Volver</button>'+
    '<div class="err" id="le"'+(msg?' style="display:block"':'')+'>'+esc(msg||'')+'</div></div>');
  $('lp').addEventListener('keydown',function(e){ if(e.key==='Enter') entrar(); });
}
function entrar(){
  var u=$('lu').value.trim().toLowerCase(), p=$('lp').value;
  if(!u||!p){ mostrarErr('le','Escribe tu usuario y contraseña.'); return; }
  if(!USUARIOS_QR[u.split('@')[0]]){ mostrarErr('le','Este usuario solo puede consultar la ficha; no tiene permiso para dar de alta ni editar.'); return; }
  $('lb').disabled=true; $('lb').textContent='Verificando…';
  var correo = u.indexOf('@')>=0 ? u : (u+'@'+AUTH_DOMINIO);
  auth.signInWithEmailAndPassword(correo,p).catch(function(err){
    $('lb').disabled=false; $('lb').textContent='Entrar';
    var c=(err&&err.code)||'';
    mostrarErr('le', c==='auth/too-many-requests'?'Demasiados intentos. Espera unos minutos.':
                     c==='auth/network-request-failed'?'Sin conexión a internet.':'Usuario o contraseña incorrectos.');
  });
}
function salir(){ auth.signOut(); }
function mostrarErr(id,m){ var e=$(id); if(e){ e.textContent=m; e.style.display='block'; } }

// ─────────────────────────────────────────────────────────────────────────────
// 2. Cargar el inventario y buscar el bien de esta etiqueta
// ─────────────────────────────────────────────────────────────────────────────
function cargar(){
  vista('<div class="spin"></div><p class="centro muted">Buscando '+esc(FOLIO)+'…</p>');
  // La escucha mantiene la copia local al día (necesario para guardar sin pisar cambios)
  refHW.on('value', function(snap){
    hwLista = aArreglo(snap.val()); 
    var primera = !hwCargado; hwCargado = true;
    if(primera) decidir();
  }, function(err){
    vista('<div class="card"><h2>Sin acceso</h2><p class="muted">No se pudo leer el inventario. Verifica que tu usuario esté autorizado.</p></div>');
  });
}
function buscarBien(){
  return hwLista.find(function(h){ return h && (h.etiqueta===FOLIO || h.inv===FOLIO); }) || null;
}
function decidir(msgOk){
  bien = buscarBien();
  if(bien) verFicha(msgOk); else sinRegistro();
}

// ─────────────────────────────────────────────────────────────────────────────
// 3a. El bien ya existe: ficha
// ─────────────────────────────────────────────────────────────────────────────
function verFicha(msgOk){
  var b = bien;
  function d(et,v){ return '<div class="dato"><span>'+et+'</span><span>'+esc(v||'—')+'</span></div>'; }
  vista((msgOk?'<div class="ok">'+esc(msgOk)+'</div>':'')+
    '<div class="card">'+encabezadoFolio()+
      '<h2>'+esc(b.desc||'Sin descripción')+'</h2><div class="muted">'+esc(b.clasif||'')+'</div>'+
      '<div id="fotoBox"></div>'+
      '<div style="margin-top:10px">'+
        (b.inv && b.inv!==FOLIO ? d('No. inventario', b.inv) : '')+
        d('Marca / modelo', [b.marca,b.modelo].filter(function(x){return x&&x!=='N/A';}).join(' · '))+
        d('No. de serie', b.serie)+
        d('Color', b.color)+
        d('Estado', b.estado)+
        d('Ubicación', b.ubicacion)+
        d('Resguardatario', b.resguardatario)+
        d('Fecha de ingreso', b.fecha)+
        (b.obs? d('Observaciones', b.obs):'')+
      '</div>'+
      '<button class="btn pri" onclick="formulario(true)">✏️ Editar datos</button>'+
    '</div>');
  if(b.tieneFoto) cargarFoto();
}

// ─────────────────────────────────────────────────────────────────────────────
// 3b. Etiqueta sin asignar: registrar nuevo o ligar a uno existente
// ─────────────────────────────────────────────────────────────────────────────
function sinRegistro(){
  vista('<div class="card">'+encabezadoFolio()+
    '<div class="aviso">Esta etiqueta todavía no está asignada a ningún bien.</div>'+
    '<button class="btn pri" onclick="formulario(false)">➕ Registrar un bien nuevo</button>'+
    '<button class="btn sec" onclick="ligarExistente()">🔗 Ligar a un bien ya registrado</button>'+
    '<p class="muted" style="margin-top:12px">Usa "Ligar" cuando el equipo ya está en el sistema con otro número (por ejemplo cosmos_Eq_001) y solo le vas a pegar esta etiqueta.</p>'+
  '</div>');
}

function ligarExistente(){
  var html='<div class="card">'+encabezadoFolio()+
    '<h2>Ligar a un bien registrado</h2>'+
    '<input id="busca" placeholder="Buscar por número, descripción, serie o persona" oninput="filtrarLista()">'+
    '<div id="lista"></div>'+
    '<button class="btn gray" onclick="decidir()">Cancelar</button></div>';
  vista(html); filtrarLista();
}
function filtrarLista(){
  var q=($('busca').value||'').toLowerCase();
  var cands=hwLista.filter(function(h){
    if(!h || h.etiqueta) return false;
    if(PREFIJO==='ME' && !/mobiliario/i.test(h.clasif||'') && !/otro/i.test(h.clasif||'')) return false;
    if(PREFIJO==='EC' && /mobiliario/i.test(h.clasif||'')) return false;
    if(!q) return true;
    return [h.inv,h.desc,h.serie,h.marca,h.modelo,h.resguardatario].some(function(v){ return (v||'').toLowerCase().indexOf(q)>=0; });
  }).slice(0,40);
  $('lista').innerHTML = cands.length ? cands.map(function(h){
    return '<div class="lista-item" onclick="confirmarLigar('+h.id+')"><b>'+esc(h.inv)+'</b><div>'+esc(h.desc)+'</div><div class="muted">'+esc([h.marca,h.serie,h.resguardatario].filter(Boolean).join(' · '))+'</div></div>';
  }).join('') : '<p class="muted">No hay bienes sin etiqueta que coincidan.</p>';
}
function confirmarLigar(id){
  var h=hwLista.find(function(x){return x.id===id;}); if(!h) return;
  if(!confirm('¿Pegar la etiqueta '+FOLIO+' al bien '+h.inv+' — '+h.desc+'?')) return;
  guardarEnInventario(function(arr){
    var i=arr.findIndex(function(x){return x&&x.id===id;});
    if(i<0) return 'No se encontró el bien.';
    if(arr.some(function(x){ return x && x.etiqueta===FOLIO; })) return 'Esta etiqueta ya fue asignada a otro bien.';
    arr[i].etiqueta=FOLIO;
    arr[i].etiquetaAsignada={por:usuarioNombre, fecha:hoy()};
  }, 'Etiqueta ligada a '+h.inv+'.');
}

// ─────────────────────────────────────────────────────────────────────────────
// 4. Formulario (alta nueva o edición)
// ─────────────────────────────────────────────────────────────────────────────
function opciones(lista, sel){ return lista.map(function(o){ return '<option'+(o===sel?' selected':'')+'>'+esc(o)+'</option>'; }).join(''); }
function formulario(editar){
  var b = editar ? bien : {};
  fotoNueva = null;
  var clasifs = (CLASIF[PREFIJO]||[]).concat(['Otro']);
  if(b.clasif && clasifs.indexOf(b.clasif)<0) clasifs.unshift(b.clasif);
  var resgs = {}; hwLista.forEach(function(h){ if(h&&h.resguardatario) resgs[h.resguardatario]=1; });
  vista('<div class="card">'+encabezadoFolio()+
    '<h2>'+(editar?'Editar bien':'Registrar bien nuevo')+'</h2>'+
    (editar && b.inv!==FOLIO ? '<label>No. inventario</label><input value="'+esc(b.inv)+'" readonly>' : '<label>No. inventario (etiqueta)</label><input value="'+esc(FOLIO)+'" readonly>')+
    '<label>Clasificación <span class="req">*</span></label><select id="f-clasif">'+opciones(clasifs,b.clasif)+'</select>'+
    '<label>Descripción <span class="req">*</span></label><input id="f-desc" value="'+esc(b.desc)+'" placeholder="Ej. Laptop, silla ejecutiva, escritorio">'+
    '<label>Marca</label><input id="f-marca" value="'+esc(b.marca)+'">'+
    '<label>Modelo</label><input id="f-modelo" value="'+esc(b.modelo)+'">'+
    '<label>No. de serie</label><input id="f-serie" value="'+esc(b.serie)+'" autocapitalize="characters">'+
    '<label>Color</label><input id="f-color" value="'+esc(b.color)+'">'+
    '<label>Estado <span class="req">*</span></label><select id="f-estado">'+opciones(ESTADOS,b.estado||'Bueno')+'</select>'+
    '<label>Ubicación</label><select id="f-ubicacion">'+opciones(UBICACIONES,b.ubicacion||'Oficina Toluca')+'</select>'+
    '<label>Resguardatario</label><input id="f-resguardatario" list="dl-resg" value="'+esc(b.resguardatario)+'" placeholder="Persona responsable">'+
    '<datalist id="dl-resg">'+Object.keys(resgs).sort().map(function(r){return '<option value="'+esc(r)+'">';}).join('')+'</datalist>'+
    '<label>Fecha de ingreso</label><input id="f-fecha" type="date" value="'+esc(b.fecha||hoy())+'">'+
    '<label>No. de factura</label><input id="f-factura" value="'+esc(b.factura)+'">'+
    '<label>Proveedor</label><input id="f-proveedor" value="'+esc(b.proveedor)+'">'+
    '<label>Especificaciones técnicas</label><textarea id="f-especif">'+esc(b.especif)+'</textarea>'+
    '<label>Observaciones</label><textarea id="f-obs">'+esc(b.obs)+'</textarea>'+
    '<label>Foto del bien</label>'+
    '<input id="f-foto" type="file" accept="image/*" capture="environment" onchange="leerFoto(this)">'+
    '<img id="f-prev" class="foto fotoprev oculto" alt="Vista previa">'+
    '<button class="btn pri" id="btnGuardar" onclick="guardarForm('+(editar?'true':'false')+')">Guardar</button>'+
    '<button class="btn gray" onclick="decidir()">Cancelar</button>'+
    '<div class="err" id="ferr"></div>'+
  '</div>');
}

// Reduce la foto a máximo 1024 px y JPEG para que no pese
function leerFoto(input){
  var f=input.files&&input.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=1024, w=img.width, h=img.height, k=Math.min(1, max/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      fotoNueva=c.toDataURL('image/jpeg',0.72);
      var p=$('f-prev'); p.src=fotoNueva; p.classList.remove('oculto');
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(f);
}

function guardarForm(editar){
  var v=function(id){ return ($('f-'+id).value||'').trim(); };
  if(!v('desc')){ mostrarErr('ferr','La descripción es obligatoria.'); return; }
  var campos=['clasif','desc','marca','modelo','serie','color','estado','ubicacion','resguardatario','fecha','factura','proveedor','especif','obs'];
  var datos={}; campos.forEach(function(c){ datos[c]=v(c); });
  var foto=fotoNueva;
  guardarEnInventario(function(arr){
    var i;
    if(editar){
      i=arr.findIndex(function(x){ return x && x.id===bien.id; });
      if(i<0) return 'El bien ya no existe en el inventario.';
      var prev=arr[i];
      var hist=(prev.historialResguardo||[]).slice();
      if((prev.resguardatario||'')!==(datos.resguardatario||'')){
        if(prev.resguardatario) hist.push({accion:'Liberado', nombre:prev.resguardatario, fecha:hoy(), estado:datos.estado, notas:'Editado desde etiqueta QR por '+usuarioNombre});
        if(datos.resguardatario) hist.push({accion:'Asignado', nombre:datos.resguardatario, fecha:hoy(), estado:datos.estado, notas:'Editado desde etiqueta QR por '+usuarioNombre});
      }
      if((prev.estado||'')!==(datos.estado||'')) hist.push({accion:'Cambio de estado', nombre:datos.resguardatario||'', fecha:hoy(), de:prev.estado||'', estado:datos.estado, notas:'Editado desde etiqueta QR por '+usuarioNombre});
      Object.keys(datos).forEach(function(k){ prev[k]=datos[k]; });
      prev.historialResguardo=hist;
      if(foto) prev.tieneFoto=true;
    } else {
      if(arr.some(function(x){ return x && (x.etiqueta===FOLIO || x.inv===FOLIO); })) return 'Esta etiqueta ya fue registrada por alguien más. Recarga la página.';
      var nuevo={id:Date.now(), inv:FOLIO, etiqueta:FOLIO, documentos:[], altaPorQR:{por:usuarioNombre, fecha:hoy()}};
      Object.keys(datos).forEach(function(k){ nuevo[k]=datos[k]; });
      nuevo.historialResguardo = datos.resguardatario ? [{accion:'Asignado', nombre:datos.resguardatario, fecha:hoy(), estado:datos.estado, notas:'Alta desde etiqueta QR por '+usuarioNombre}] : [];
      if(foto) nuevo.tieneFoto=true;
      arr.push(nuevo);
    }
  }, editar?'Cambios guardados.':'Bien registrado con la etiqueta '+FOLIO+'.', foto);
}

// Guarda en proesa/hw con una transacción (no pisa cambios de otras personas)
function guardarEnInventario(modificar, msgOk, foto){
  var btn=$('btnGuardar'); if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
  var errorMsg=null;
  refHW.transaction(function(actual){
    if(actual===null && hwLista.length>0) return; // copia local aún no lista: cancelar
    var arr=aArreglo(actual);
    errorMsg = modificar(arr) || null;
    if(errorMsg) return; // cancelar
    return arr;
  }).then(function(res){
    if(!res.committed){ throw new Error(errorMsg || 'No se pudo guardar. Intenta de nuevo.'); }
    var tareas=[ db.ref('proesa/_ts').set(Date.now()) ];
    var hb = hwLista.find(function(h){ return h && (h.etiqueta===FOLIO || h.inv===FOLIO); });
    if(hb) tareas.push(db.ref('activosPublicos/'+FOLIO).set({folio:FOLIO, desc:hb.desc||'', clasif:hb.clasif||'', marca:hb.marca||'', modelo:hb.modelo||'',
      estado:hb.estado||'', ubicacion:hb.ubicacion||'', resguardatario:hb.resguardatario||'', tieneFoto:!!(hb.tieneFoto||foto), actualizado:Date.now()}));
    if(foto) tareas.push(db.ref('hwfotos/'+FOLIO).set({data:foto, fecha:hoy(), por:usuarioNombre}));
    return Promise.all(tareas);
  }).then(function(){
    setTimeout(function(){ decidir('✓ '+msgOk); }, 300);
  }).catch(function(e){
    if(btn){ btn.disabled=false; btn.textContent='Guardar'; }
    var m = e && e.message && e.message.indexOf('permission')>=0 ? 'Tu usuario no tiene permiso para guardar.' : (e&&e.message)||'No se pudo guardar.';
    if($('ferr')) mostrarErr('ferr', m); else alert(m);
  });
}
