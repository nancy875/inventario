<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Activo fijo — cosmos.ai</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap">
<style>
:root{
  --navy:#02255d; --blue:#0A5695; --blue-bg:#E7F0F8; --red:#C0392B; --red-bg:#FBEAEA;
  --green:#1A7A4A; --green-bg:#E6F4ED; --amber:#A05C00; --amber-bg:#FEF3E2;
  --text:#1E2430; --text2:#5A6170; --text3:#8B909B; --border:#E2E0D8; --bg:#F4F3EF; --card:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Century Gothic','Didact Gothic',CenturyGothic,AppleGothic,sans-serif;background:var(--bg);color:var(--text);font-size:15px;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{background:#fff;border-bottom:3px solid var(--navy);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header img{height:34px;width:auto;display:block}
header .tit{font-size:11px;color:var(--navy);font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-top:3px}
header button{background:#fff;border:1px solid var(--border);color:var(--navy);border-radius:6px;padding:6px 10px;font-family:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
main{max-width:600px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
.folio{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.pill{font-weight:700;color:#fff;border-radius:6px;padding:3px 10px;font-size:13px}
.pill.EC{background:var(--blue)} .pill.ME{background:var(--red)}
.folio-num{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;letter-spacing:.5px;color:var(--navy)}
h2{font-size:19px;margin:6px 0 2px;color:var(--navy)} h3{font-size:13px;margin:18px 0 6px;color:var(--navy);text-transform:uppercase;letter-spacing:.6px;border-bottom:2px solid var(--navy);padding-bottom:4px}
.muted{color:var(--text2);font-size:13px}
label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{width:100%;font-family:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text)}
input[readonly]{background:#F1F0EC;color:var(--text2)}
textarea{min-height:64px;resize:vertical}
.fila{display:flex;gap:10px} .fila>div{flex:1;min-width:0}
.btn{display:block;width:100%;border:none;border-radius:10px;padding:14px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
.btn.pri{background:var(--navy);color:#fff} .btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.gray{background:#fff;color:var(--text2);border:1px solid var(--border)}
.btn:disabled{opacity:.6}
.err{background:var(--red-bg);color:var(--red);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px;display:none}
.ok{background:var(--green-bg);color:var(--green);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.aviso{background:var(--amber-bg);color:var(--amber);border-radius:8px;padding:10px 12px;font-size:13px}
.dato{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:14px}
.dato:last-child{border-bottom:none} .dato span:first-child{color:var(--text3)} .dato span:last-child{text-align:right;font-weight:600}
.resg{background:var(--blue-bg);border-radius:10px;padding:12px 14px;margin-top:12px}
.resg .n{font-size:16px;font-weight:700;color:var(--navy)} .resg .a{font-size:13px;color:var(--text2)}
.foto{width:100%;border-radius:10px;border:1px solid var(--border);margin-top:10px;display:block}
.fotoprev{max-height:220px;object-fit:cover}
.hist{border-left:3px solid var(--border);margin:8px 0 0 6px;padding-left:14px}
.hist .it{position:relative;padding:4px 0 12px}
.hist .it:before{content:"";position:absolute;left:-21px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--text3)}
.hist .it.actual:before{background:var(--green)}
.hist .nom{font-weight:700} .hist .per{font-size:12.5px;color:var(--text2)} .hist .mot{font-size:12.5px;color:var(--amber)}
.lista-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer;background:#fff}
.lista-item b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.resumen .dato span:last-child{max-width:60%}
.codigos{display:flex;align-items:center;gap:14px;border:1px dashed var(--border);border-radius:10px;padding:10px 12px;margin-top:12px}
.codigos .qr{flex:0 0 auto;width:92px;height:92px} .codigos .qr img,.codigos .qr canvas{width:92px!important;height:92px!important}
.codigos .bc{flex:1;min-width:0} .codigos .bc svg,.codigos .bc img{width:100%;height:auto;display:block}
.centro{text-align:center} .oculto{display:none}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:g 1s linear infinite;margin:18px auto}
@keyframes g{to{transform:rotate(360deg)}}
.req{color:var(--red)}
#impresion{display:none}
@media print{
  @page{size:letter;margin:14mm}
  body{background:#fff;padding:0;font-size:11pt}
  header,main{display:none!important}
  #impresion{display:block;color:#111}
}
/* Ficha impresa */
.pf-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #02255d;padding-bottom:8px}
.pf-top img{height:44px}
.pf-tit{text-align:right} .pf-tit .t{font-size:15pt;font-weight:700;color:#02255d} .pf-tit .s{font-size:9pt;color:#555}
.pf-folio{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.pf-folio .f{font-family:Consolas,monospace;font-size:20pt;font-weight:700;color:#02255d}
.pf-folio .c{font-size:10pt;color:#444}
.pf-sec{font-size:10pt;font-weight:700;color:#fff;background:#02255d;padding:4px 8px;margin:12px 0 0;text-transform:uppercase;letter-spacing:.5px}
.pf-tab{width:100%;border-collapse:collapse;font-size:9.5pt}
.pf-tab td,.pf-tab th{border:1px solid #bbb;padding:5px 7px;vertical-align:top;text-align:left}
.pf-tab th{background:#E9EDF4;color:#02255d;font-weight:700}
.pf-tab td.e{background:#F4F5F8;color:#555;width:24%;font-weight:700}
.pf-codigos{display:flex;align-items:center;gap:12px} .pf-bc svg,.pf-bc img{height:16mm;width:auto;display:block}
.pf-foto{max-height:60mm;max-width:80mm;border:1px solid #bbb;margin-top:6px}
.pf-firmas{display:flex;gap:30px;margin-top:22mm}
.pf-firmas div{flex:1;text-align:center;font-size:9.5pt;border-top:1px solid #111;padding-top:5px}
.pf-pie{margin-top:10mm;font-size:8pt;color:#666;border-top:1px solid #ccc;padding-top:5px;display:flex;justify-content:space-between}
</style>
</head>

function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function vista(html){ $('vista').innerHTML = html; window.scrollTo(0,0); }
function hoy(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fechaTxt(f){ if(!f) return '—'; var p=String(f).split('-'); if(p.length!==3) return f; var m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return parseInt(p[2],10)+' '+m[parseInt(p[1],10)-1]+' '+p[0]; }
function aArreglo(v){ if(!v) return []; return Array.isArray(v) ? v.filter(Boolean) : Object.keys(v).map(function(k){return v[k];}).filter(Boolean); }
function encabezadoFolio(){ return '<div class="folio"><span class="pill '+PREFIJO+'">'+PREFIJO+'</span><span class="folio-num">'+esc(FOLIO)+'</span></div>'; }
function d(et,v){ return '<div class="dato"><span>'+et+'</span><span>'+esc(v||'—')+'</span></div>'; }
function mostrarErr(id,m){ var e=$(id); if(e){ e.textContent=m; e.style.display='block'; e.scrollIntoView({block:'center'}); } }
function datalist(id, campo){
  var vals={}; hwLista.forEach(function(h){
    if(h && h[campo]) vals[h[campo]]=1;
    (h && h.historialResguardo||[]).forEach(function(e){ if(campo==='resguardatario' && e.nombre) vals[e.nombre]=1; if(campo==='area' && e.area) vals[e.area]=1; });
  });
  return '<datalist id="'+id+'">'+Object.keys(vals).sort().map(function(v){return '<option value="'+esc(v)+'">';}).join('')+'</datalist>';
}

// Periodos de resguardo a partir del historial (nunca se borra nada; solo se agrega)
function periodosResguardo(b){
  var hist=(b.historialResguardo||[]), per=[];
  hist.forEach(function(e){
    if(!e) return;
    if(e.accion==='Asignado'){ per.push({nombre:e.nombre||'', area:e.area||'', desde:e.fecha||'', hasta:'', motivo:'', nota:''}); }
    else if(e.accion==='Liberado'){
      for(var i=per.length-1;i>=0;i--){ if(!per[i].hasta && (!e.nombre || per[i].nombre===e.nombre)){ per[i].hasta=e.fecha||''; per[i].motivo=e.motivo||''; per[i].nota=e.notas||''; break; } }
    }
  });
  if(!per.length && b.resguardatario) per.push({nombre:b.resguardatario, area:b.area||'', desde:b.fechaResguardo||b.fecha||'', hasta:'', motivo:'', nota:''});
  var act = per.length && !per[per.length-1].hasta ? per[per.length-1] : null;
  if(act && !act.area && b.area) act.area=b.area;
  return per;
}

function urlEtiqueta(){ return location.origin+location.pathname+'?inv='+FOLIO; }
function bloqueCodigos(){ return '<div class="codigos"><div class="qr" id="cod-qr"></div><div class="bc"><svg id="cod-bc"></svg><div class="muted" style="margin-top:4px">Código de la etiqueta</div></div></div>'; }
function pintarCodigos(qrId, bcId, tam){
  try{ var q=$(qrId); if(q){ q.innerHTML=''; new QRCode(q,{text:urlEtiqueta(), width:tam, height:tam, correctLevel:QRCode.CorrectLevel.M}); } }catch(e){}
  try{ var b=$(bcId); if(b) JsBarcode(b, FOLIO, {format:'CODE128', displayValue:true, font:'Arial', fontSize:14, height:48, margin:0, textMargin:2}); }catch(e){}
}

  });
}

function vistaPublica(){
  try{ refHW.off(); }catch(e){}
  hwCargado=false;
  vista('<div class="spin"></div>');
  db.ref('activosPublicos/'+FOLIO).once('value').then(function(s){
    var b=s.val();
    var boton='<button class="btn gray" onclick="pantallaLogin()">🔐 Personal autorizado: iniciar sesión</button>';
    if(!b){ vista('<div class="card">'+encabezadoFolio()+'<div class="aviso">Esta etiqueta todavía no está registrada.</div>'+boton+'</div>'); return; }
    vista('<div class="card">'+encabezadoFolio()+
      '<h2>'+esc(b.desc||'Sin nombre')+'</h2><div class="muted">'+esc(b.clasif||'')+'</div>'+
      '<div id="fotoBox"></div>'+
      '<div style="margin-top:10px">'+
        d('Marca / modelo',[b.marca,b.modelo].filter(function(x){return x&&x!=='N/A';}).join(' · '))+
        d('No. de serie',b.serie)+d('Color',b.color)+d('Estado',b.estado)+d('Ubicación',b.ubicacion)+
      '</div>'+
      '<div class="resg"><div class="muted">Bajo resguardo de</div><div class="n">'+esc(b.resguardatario||'Sin asignar')+'</div>'+
        '<div class="a">'+esc(b.area||'')+(b.resguardoDesde?' · desde '+fechaTxt(b.resguardoDesde):'')+'</div></div>'+
      bloqueCodigos()+
      '<p class="muted" style="margin-top:12px">Activo fijo propiedad de cosmos.ai. Si encuentras este bien fuera de su lugar, avisa al área de Administración.</p>'+
      boton+'</div>');
    pintarCodigos('cod-qr','cod-bc',92);
    if(b.tieneFoto) cargarFoto();
  }).catch(function(err){
    var permiso = err && /permission/i.test(err.message||err.code||'');
    vista('<div class="card">'+encabezadoFolio()+
      '<p class="muted">'+(permiso?'La ficha pública de esta etiqueta todavía no está disponible.':'No se pudo consultar la etiqueta. Revisa tu conexión.')+'</p>'+
      '<button class="btn gray" onclick="pantallaLogin()">🔐 Personal autorizado: iniciar sesión</button></div>');
  });
}
function cargarFoto(cb){
  var box=$('fotoBox'); if(box) box.innerHTML='<div class="spin"></div>';
  db.ref('hwfotos/'+FOLIO).once('value').then(function(s){
    var f=s.val(); var src=f&&(f.data||f); var ok=(typeof src==='string' && src.indexOf('data:image')===0);
    if($('fotoBox')) $('fotoBox').innerHTML = ok ? '<img class="foto" src="'+src+'" alt="Foto del bien">' : '';
    if(cb) cb(ok?src:null);
  }).catch(function(){ if($('fotoBox')) $('fotoBox').innerHTML=''; if(cb) cb(null); });
}

function pantallaLogin(msg){
  vista('<div class="card">'+encabezadoFolio()+
    '<p class="muted">Solo para personal autorizado de cosmos.ai.</p>'+
    '<label>Usuario</label><input id="lu" autocomplete="username" autocapitalize="none" placeholder="tu usuario">'+
    '<label>Contraseña</label><input id="lp" type="password" autocomplete="current-password">'+
    '<button class="btn pri" id="lb" onclick="entrar()">Entrar</button>'+
    '<button class="btn gray" onclick="vistaPublica()">Volver</button>'+
    '<div class="err" id="le"'+(msg?' style="display:block"':'')+'>'+esc(msg||'')+'</div></div>');
  $('lp').addEventListener('keydown',function(e){ if(e.key==='Enter') entrar(); });
}
function entrar(){
  var u=$('lu').value.trim().toLowerCase(), p=$('lp').value;
  if(!u||!p){ mostrarErr('le','Escribe tu usuario y contraseña.'); return; }
  if(!USUARIOS_QR[u.split('@')[0]]){ mostrarErr('le','Este usuario solo puede consultar la ficha; no tiene permiso para dar de alta ni editar.'); return; }
  $('lb').disabled=true; $('lb').textContent='Verificando…';
  auth.signInWithEmailAndPassword(u.indexOf('@')>=0?u:(u+'@'+AUTH_DOMINIO), p).catch(function(err){
    $('lb').disabled=false; $('lb').textContent='Entrar';
    var c=(err&&err.code)||'';

function leerFoto(input){
  var f=input.files&&input.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(e){ var img=new Image(); img.onload=function(){
    var max=1024, k=Math.min(1, max/Math.max(img.width,img.height)), c=document.createElement('canvas');
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    fotoNueva=c.toDataURL('image/jpeg',0.72); var p=$('f-prev'); p.src=fotoNueva; p.classList.remove('oculto');
  }; img.src=e.target.result; };
  r.readAsDataURL(f);
}

    '<button class="btn gray" onclick="decidir()">Cancelar</button><div class="err" id="ferr"></div></div>');
  pintarCodigos('cod-qr','cod-bc',92);

function guardarCambioResguardo(){
  var f=$('c-fecha').value, n=($('c-nombre').value||'').trim(), a=($('c-area').value||'').trim();
  var mot=$('c-motivo')?$('c-motivo').value:'', nota=$('c-nota')?($('c-nota').value||'').trim():'';
  if(!f) return mostrarErr('ferr','Falta la fecha del cambio.');
  if($('c-motivo') && !mot) return mostrarErr('ferr','Selecciona el motivo por el que termina el resguardo actual.');
  if(!n) return mostrarErr('ferr','Falta el nuevo resguardatario.');
  if(!a) return mostrarErr('ferr','Falta el área.');
  if(n===bien.resguardatario && a===bien.area) return mostrarErr('ferr','Es la misma persona y la misma área.');
  var per=periodosResguardo(bien), act=per.length&&!per[per.length-1].hasta?per[per.length-1]:null;
  if(act && act.desde && f<act.desde) return mostrarErr('ferr','La fecha del cambio no puede ser anterior al inicio del resguardo actual ('+fechaTxt(act.desde)+').');
  var id=bien.id;
  guardarEnInventario(function(arr){
    var i=arr.findIndex(function(x){ return x && x.id===id; }); if(i<0) return 'El bien ya no existe en el inventario.';
    var p=arr[i], h=(p.historialResguardo||[]).slice();
    if(!h.length && p.resguardatario) h.push({accion:'Asignado', nombre:p.resguardatario, area:p.area||'', fecha:p.fechaResguardo||p.fecha||'', notas:'Resguardo previo al historial', por:usuarioNombre, registrado:hoy()});
    if(p.resguardatario) h.push({accion:'Liberado', nombre:p.resguardatario, area:p.area||'', fecha:f, motivo:mot, notas:nota, estado:p.estado||'', por:usuarioNombre, registrado:hoy()});
    h.push({accion:'Asignado', nombre:n, area:a, fecha:f, estado:p.estado||'', notas:'', por:usuarioNombre, registrado:hoy()});
    p.historialResguardo=h; p.resguardoAnterior=p.resguardatario||''; p.resguardatario=n; p.area=a; p.fechaResguardo=f;
  }, 'Resguardo actualizado. El anterior quedó en el historial.');
}

// ─── Guardado (transacción: no pisa cambios de otras personas) ───────────────
function guardarEnInventario(modificar, msgOk, foto, alTerminar){
  var btn=$('btnGuardar'); if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
  var errorMsg=null;
  refHW.transaction(function(actual){
    if(actual===null && hwLista.length>0) return;
    var arr=aArreglo(actual); errorMsg = modificar(arr) || null;
    if(errorMsg) return; return arr;
  }).then(function(res){
    if(!res.committed) throw new Error(errorMsg || 'No se pudo guardar. Intenta de nuevo.');
    var tareas=[ db.ref('proesa/_ts').set(Date.now()) ];
    var hb = hwLista.find(function(h){ return h && (h.etiqueta===FOLIO || h.inv===FOLIO); });
    if(hb){
      var per=periodosResguardo(hb), act=per.length&&!per[per.length-1].hasta?per[per.length-1]:null;
      tareas.push(db.ref('activosPublicos/'+FOLIO).set({folio:FOLIO, desc:hb.desc||'', clasif:hb.clasif||'', marca:hb.marca||'', modelo:hb.modelo||'',
        serie:hb.serie||'', color:hb.color||'', estado:hb.estado||'', ubicacion:hb.ubicacion||'', resguardatario:hb.resguardatario||'', area:hb.area||'',
        resguardoDesde:(act&&act.desde)||'', tieneFoto:!!(hb.tieneFoto||foto), actualizado:Date.now()}));
    }
    if(foto) tareas.push(db.ref('hwfotos/'+FOLIO).set({data:foto, fecha:hoy(), por:usuarioNombre}));
    return Promise.all(tareas);
  }).then(function(){ if(alTerminar) alTerminar(); fotoNueva=null; setTimeout(function(){ decidir('✓ '+msgOk); }, 300); })
  .catch(function(e){
    if(btn){ btn.disabled=false; btn.textContent='Guardar'; }
    var m = e && e.message && e.message.indexOf('permission')>=0 ? 'Tu usuario no tiene permiso para guardar.' : (e&&e.message)||'No se pudo guardar.';
    if($('ferr')) mostrarErr('ferr', m); else alert(m);
  });
}

      '<div class="pf-sec">Datos generales del bien</div><table class="pf-tab">'+
        fila('Nombre del equipo',b.desc)+fila('Clasificación',b.clasif)+fila('No. de serie',b.serie)+
        fila('Marca / modelo',[b.marca,b.modelo].filter(function(x){return x&&x!=='N/A';}).join(' · '))+fila('Color',b.color)+fila('Estado',b.estado)+
        fila('Ubicación',b.ubicacion)+fila('Fecha de ingreso',fechaTxt(b.fecha))+(b.factura?fila('No. de factura',b.factura):'')+(b.proveedor?fila('Proveedor',b.proveedor):'')+
        (b.especif?fila('Especificaciones',b.especif):'')+(b.obs?fila('Observaciones',b.obs):'')+'</table>'+
      (fotoSrc?'<img class="pf-foto" src="'+fotoSrc+'">':'')+
      '<div class="pf-sec">Resguardo actual</div><table class="pf-tab">'+fila('Resguardatario',b.resguardatario)+fila('Área',b.area)+fila('Desde',act?fechaTxt(act.desde):'—')+'</table>'+
      '<div class="pf-sec">Historial de resguardo</div><table class="pf-tab"><tr><th>#</th><th>Resguardatario</th><th>Área</th><th>Desde</th><th>Hasta</th><th>Motivo de término</th></tr>'+histRows+'</table>'+
      '<p style="font-size:9pt;margin-top:10px">El resguardatario se compromete a hacer buen uso del bien descrito, a conservarlo en buen estado y a devolverlo cuando le sea requerido o al terminar su relación laboral con la empresa.</p>'+
      '<div class="pf-firmas"><div>Entrega<br><b>Administración y Control Interno</b></div><div>Recibe<br><b>'+esc(b.resguardatario||'')+'</b></div></div>'+
      '<div class="pf-pie"><span>cosmos.ai · Activo fijo '+esc(FOLIO)+'</span><span>Impreso el '+fechaTxt(hoy())+' por '+esc(usuarioNombre)+'</span></div>';
    pintarCodigos('pf-qr','pf-bc',96);
    setTimeout(function(){ window.print(); }, 400);
  }
  if(b.tieneFoto){
    db.ref('hwfotos/'+FOLIO).once('value').then(function(s){ var f=s.val(); var src=f&&(f.data||f); construir(typeof src==='string'&&src.indexOf('data:image')===0?src:null); })
      .catch(function(){ construir(null); });
  } else construir(null);
}
</script>
